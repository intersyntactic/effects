name: is_effects
description: >-
  The shared vocabulary of intersyntactic's actions: what reading, writing,
  starting a program and reaching the world take and give back, and the
  drivers that carry them out.
version: 0.14.1
repository: https://github.com/intersyntactic/effects

environment:
  sdk: ^3.13.0

dependencies:
  is_path_confinement: ^0.1.0
  is_web_address_vocabulary: ^0.1.0
  path: ^1.9.1

# Until is_web_address_vocabulary 0.1.0 is on pub.dev.
dependency_overrides:
  is_web_address_vocabulary:
    git:
      url: https://github.com/intersyntactic/web_address_vocabulary
      ref: initial-package

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.25.0
